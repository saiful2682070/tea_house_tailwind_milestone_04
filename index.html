<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEA HOUSE</title>

    <!-- Connect Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Connect Font awesome -->
    <script src="https://kit.fontawesome.com/05738b3cfa.js" crossorigin="anonymous"></script>

    <!-- Connect Google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">

    <!-- Internal Style -->
    <style>
        * {
            font-family: "Manrope", sans-serif;
        }
    </style>

</head>

<body>
    <!-- Banner Section -->
    <section class="container mx-auto mt-[70px] grid grid-cols-2 ">
        <div class="banner_left_side space-y-[30px]">
            <h1 class="font-extrabold text-[80px]">It's good <br> tea time at The <br> Tea House</h1>
            <p class="text-[#777777] text-xl font-semibold">Tea and Botanical Solutions Supplier Give Optimum <br> Satisfaction To Your Taste Buds.</p>
            <button class="font-bold text-xl text-white p-5 bg-gradient-to-r from-[#ff0000] to-[#ff8938] flex rounded-xl">Explore More <img class="ml-4" src="./images/arrow.png" alt=""></button>
        </div>

        <div class="banner_right_side relative flex justify-end items-end">
            <img class="" src="./images/banner.png" alt="">
            <div class="flex justify-center gap-3 items-center bg-white shadow-2xl rounded-xl w-[255px] absolute bottom-5 left-52 p-5">
                <img class="" src="./images/rating.png" alt="">
                <div class="">
                    <h3 class="font-bold text-2xl">5.00</h3>
                    <p class="text-[#777777] font-semibold">Trust Pilot Rating</p>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
